name: waanofi
description: "Waanofi Dairy"
publish_to: "none"
version: 1.0.0+8

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  fl_chart: ^0.70.2

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Backend
  supabase_flutter: ^2.9.0

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Internationalization
  intl: ^0.20.2

  # Offline-first storage (Drift — type-safe SQL)
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Connectivity
  connectivity_plus: ^6.1.4
  csv: ^6.0.0
  pdf: ^3.12.0
  printing: ^5.14.3
  sentry_flutter: ^9.25.0
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3
  drift_dev: ^2.24.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.webp"
  web:
    generate: true
    image_path: "assets/images/logo.webp"
    background_color: "#ffffff"
    theme_color: "#ffffff"
