name: Waanofi CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x' # or your target version
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate files
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Web
        run: flutter build web --release

      # Optionally add step for Android APK / AppBundle if needed
      # - name: Build Android APK
      #   run: flutter build apk --release
